target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F", "B", "C901"]
ignore = ["E701", "E702", "E741", "F841", "B008", "F401", "E402"]

[lint.mccabe]
max-complexity = 15

[lint.per-file-ignores]
"tests/**/*.py" = ["E402", "B", "C901"]
"scripts/**/*.py" = ["E402", "B", "C901"]
"docs/**/*.py" = ["E402", "B", "C901"]
"src/crypto_strategies/backtest/combo_replay.py" = ["C901"]
"src/crypto_strategies/backtest/live_pool_simulator.py" = ["C901"]
"src/crypto_strategies/entrypoints/_common.py" = ["C901"]
"src/crypto_strategies/entrypoints/_metrics.py" = ["C901"]
"src/crypto_strategies/entrypoints/btc_dca.py" = ["C901"]
"src/crypto_strategies/entrypoints/trend_rotation.py" = ["B"]
"src/crypto_strategies/strategies/crypto_btc_dca.py" = ["C901"]
"src/crypto_strategies/strategies/crypto_live_pool_rotation/core.py" = ["C901"]
"src/crypto_strategies/strategies/crypto_trend_rotation.py" = ["C901"]
