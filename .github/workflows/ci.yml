name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Actionlint
        uses: docker://rhysd/actionlint:1.7.12

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check whitespace
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            # -M matters. `git diff-tree` is plumbing and does no rename
            # detection unless asked, so a renamed file is compared as if it
            # were wholly new and every trailing space already in it is
            # reported against this commit. `git diff` above does detect
            # renames, which is why only this branch has the problem.
            git diff-tree --check --no-commit-id --root -r -M HEAD
          fi

      - name: Resolve QuantPlatformKit ref
        id: quant-platform-kit-ref
        run: |
          set -euo pipefail
          ref="main"
          if [ -n "${GITHUB_HEAD_REF:-}" ] && git ls-remote --exit-code --heads https://github.com/QuantStrategyLab/QuantPlatformKit.git "${GITHUB_HEAD_REF}" >/dev/null 2>&1; then
            ref="${GITHUB_HEAD_REF}"
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout QuantPlatformKit
        uses: actions/checkout@v6
        with:
          repository: QuantStrategyLab/QuantPlatformKit
          ref: ${{ steps.quant-platform-kit-ref.outputs.ref }}
          path: external/QuantPlatformKit

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . numpy pandas pytest pytest-cov ruff==0.15.22 build

      - name: Verify dependencies
        run: |
          set -euo pipefail
          python -m pip check

      - name: Run Ruff
        run: |
          set -euo pipefail
          ruff check .

      - name: Check QPK pin and lock consistency
        run: |
          set -euo pipefail
          python external/QuantPlatformKit/scripts/check_qpk_pin_consistency.py \
            --root . \
            --pin-file external/QuantPlatformKit/QPK_PIN

      - name: Run unit tests
        run: |
          set -euo pipefail
          python -m pytest -q tests --cov --cov-report=term --cov-report=xml

      - name: Build package
        run: |
          set -euo pipefail
          python -m build

  normal-wheel-baseline:
    name: Normal wheel baseline (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build the normal wheel
        run: |
          set -euo pipefail
          python -m pip install build
          python -m build --wheel --outdir dist
          sha256sum dist/*.whl

      - name: Install only the wheel and its declared dependencies
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/crypto-normal-wheel"
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          test -f "${wheels[0]}"
          "${RUNNER_TEMP}/crypto-normal-wheel/bin/python" -I -m pip install \
            --no-cache-dir --report "${RUNNER_TEMP}/normal-wheel-install.json" \
            "${wheels[0]}"
          "${RUNNER_TEMP}/crypto-normal-wheel/bin/python" -I -m pip check

      - name: Reproduce the missing runtime dependency
        run: |
          set -euo pipefail
          qpk_commit="$(python - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          dependencies = tomllib.loads(Path("pyproject.toml").read_text())["project"]["dependencies"]
          prefix = "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@"
          matches = [item.removeprefix(prefix) for item in dependencies if item.startswith(prefix)]
          assert len(matches) == 1 and re.fullmatch(r"[0-9a-f]{40}", matches[0]), matches
          print(matches[0])
          PY
          )"
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/crypto-normal-wheel/bin/python" -I \
            "${GITHUB_WORKSPACE}/scripts/check_normal_wheel_install.py" \
            --expected-qpk-commit "${qpk_commit}" --expect-missing pandas
